<!DOCTYPE html>
<html lang="de">
<head>

  <title>Mein H5P-Inhalt</title>

  <link rel="stylesheet" href="https://diversewolken.ddns.net/h5p-standalone/dist/styles/h5p.css" />
</head>
<body>

  <script>

      frameCss: 'https://diversewolken.ddns.net/h5p-standalone/dist/styles/h5p.css'
